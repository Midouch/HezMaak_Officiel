<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg-circle { fill: #ffffff; stroke: #0d3863; stroke-width: 12; }
      .main-text { fill: #0d3863; }
      .dashed-line { stroke: #0d3863; stroke-width: 3; stroke-dasharray: 6,6; fill: none; }
      .airplane-line { stroke: #0d3863; stroke-width: 3; fill: none; }
      .bottom-shape { fill: #0d3863; }
      .white-stroke { stroke: #ffffff; stroke-width: 3; fill: none; }
      .tunisia-red { fill: #e21a22; }
      .eu-blue { fill: #003399; }
      .eu-star { fill: #ffcc00; }
    </style>
  </defs>

  <!-- Cerchio esterno -->
  <circle cx="250" cy="250" r="235" class="bg-circle" />

  <!-- Aeroplano di Carta in Alto -->
  <g transform="translate(150, 40) scale(0.9)" stroke="#0d3863" stroke-width="4" fill="none" stroke-linejoin="round">
    <polygon points="50,15 10,75 90,55" />
    <polygon points="50,15 50,85 90,55" />
    <path d="M 50,65 L 35,70 L 50,85 Z" fill="#0d3863" opacity="0.15"/>
    <path d="M 50,65 L 50,85" />
  </g>

  <!-- Scia tratteggiata -->
  <path d="M 245,115 Q 310,95 365,115 T 420,165" class="dashed-line" stroke-linecap="round"/>

  <!-- Testo Calligrafico Arabo Vettoriale -->
  <g class="main-text" transform="translate(0, -10)">
    <path d="M 370,220 C 370,180 430,170 430,225 C 430,260 395,265 360,265 C 330,265 320,240 320,220 C 320,180 355,185 365,205 C 370,215 360,230 350,225 C 345,220 345,210 355,205" stroke="#0d3863" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="335" cy="165" r="7" />
    <circle cx="355" cy="165" r="7" />
    <path d="M 325,250 C 300,250 295,210 270,210 C 240,210 240,260 280,260 C 300,260 310,245 325,248" stroke="#0d3863" stroke-width="6" fill="none"/>
    <path d="M 285,235 C 285,215 255,215 255,235 C 255,255 285,255 285,235 Z" />
    <path d="M 250,252 C 220,252 205,210 180,215 C 160,218 150,240 170,255 C 185,265 210,260 230,260 C 235,260 237,200 238,165" stroke="#0d3863" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 160,185 L 160,245 C 160,265 110,265 85,250 C 65,238 65,210 80,195" stroke="#0d3863" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 115,210 Q 130,215 125,225 T 140,225" stroke="#0d3863" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Linee dinamiche (Verde e Rosso) -->
  <path d="M 95,290 C 130,275 220,270 300,278" stroke="#1d824c" stroke-width="10" fill="none" stroke-linecap="round" />
  <path d="M 240,298 C 290,298 370,285 415,265" stroke="#e21a22" stroke-width="8" fill="none" stroke-linecap="round" />

  <!-- Scia inferiore con Cuore e Aereo -->
  <path d="M 165,360 Q 195,370 215,355 Q 225,340 235,350 Q 245,360 250,350 Q 260,340 270,355 Q 290,370 325,355" class="dashed-line" />
  <path d="M 250,356 C 245,346 233,346 233,356 C 233,366 250,376 250,376 C 250,376 267,366 267,356 C 267,346 255,346 250,356 Z" fill="none" stroke="#0d3863" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(290, 345) rotate(45) scale(0.7)" fill="#0d3863">
    <path d="M0,10 L5,25 L15,25 L8,12 L18,5 L12,0 L0,5 L-12,0 L-18,5 L-8,12 L-15,25 L-5,25 Z"/>
  </g>

  <!-- BANDIERA DELLA TUNISIA -->
  <g transform="translate(85, 310) rotate(-15)">
    <rect x="0" y="0" width="75" height="50" rx="10" class="tunisia-red" />
    <circle cx="37.5" cy="25" r="14" fill="#ffffff" />
    <path d="M 40,15 C 32,15 26,20 26,25 C 26,30 32,35 40,35 C 35,35 30,31 30,25 C 30,19 35,15 40,15 Z" fill="#e21a22" />
    <polygon points="39,21 41,24 45,24 42,26 43,30 40,28 37,30 38,26 35,24 39,24" fill="#e21a22" transform="rotate(-10 40 25)"/>
  </g>

  <!-- BANDIERA EUROPEA (UE) -->
  <g transform="translate(330, 325) rotate(15)">
    <rect x="0" y="0" width="75" height="50" rx="10" class="eu-blue" />
    <g transform="translate(37.5, 25) scale(0.7)">
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(0, -18)"/>
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(9, -15.5)"/>
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(15.5, -9)"/>
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(18, 0)"/>
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(15.5, 9)"/>
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(9, 15.5)"/>
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(0, 18)"/>
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(-9, 15.5)"/>
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(-15.5, 9)"/>
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(-18, 0)"/>
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(-15.5, -9)"/>
      <polygon points="0,-18 3,-9 12,-9 5,-3 8,6 0,0 -8,6 -5,-3 -12,-9 -3,-9" class="eu-star" transform="translate(0, 0) scale(0.4) translate(-9, -15.5)"/>
    </g>
  </g>

  <!-- Calotta sferica inferiore -->
  <path d="M 68,426 A 223,223 0 0,0 432,426 A 235,235 0 0,1 68,426 Z" class="bottom-shape" />

  <!-- Icona Valigia -->
  <g transform="translate(225, 435) scale(0.85)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="5" y="15" width="50" height="35" rx="6" />
    <path d="M 20,15 L 20,5 C 20,3 22,1 25,1 L 35,1 C 38,1 40,3 40,5 L 40,15" />
    <path d="M 20,25 L 20,45" stroke-width="2" opacity="0.7"/>
    <path d="M 40,25 L 40,45" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
