<svg xmlns="http://w3.org" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <style>
      .main-blue { fill: #0d3863; }
      .stroke-blue { stroke: #0d3863; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dashed-path { stroke: #0d3863; stroke-width: 2.5; stroke-dasharray: 5,5; fill: none; stroke-linecap: round; }
      .tunisia-red { fill: #e21a22; }
      .eu-blue { fill: #003399; }
      .eu-star { fill: #ffcc00; }
      .line-green { stroke: #1d824c; stroke-width: 7; fill: none; stroke-linecap: round; }
      .line-red { stroke: #e21a22; stroke-width: 5; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <!-- GRUPPO ICONE A SINISTRA (Stile compatto per Header) -->
  <g transform="translate(10, 5)">
    <!-- Valigia di sfondo ridisegnata come cerchio badge -->
    <circle cx="55" cy="55" r="48" fill="#0d3863" />
    <g transform="translate(33, 33) scale(0.9)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="5" y="15" width="45" height="32" rx="5" />
      <path d="M 18,15 L 18,6 C 18,4 20,2 22,2 L 33,2 C 35,2 37,4 37,6 L 37,15" />
    </g>

    <!-- Aeroplano di carta che vola sopra il badge -->
    <g transform="translate(55, 10) scale(0.45)" stroke="#0d3863" stroke-width="6" fill="#ffffff" stroke-linejoin="round">
      <polygon points="50,15 10,75 90,55" />
      <polygon points="50,15 50,85 90,55" />
      <path d="M 50,65 L 50,85" />
    </g>

    <!-- Scia tratteggiata che collega le bandiere -->
    <path d="M 35,90 Q 60,105 85,95 Q 95,85 105,95 Q 115,105 135,95" class="dashed-path" />
    
    <!-- Icona Cuore sulla scia -->
    <path d="M 95,91 C 92,86 85,86 85,92 C 85,98 95,104 95,104 C 95,104 105,98 105,92 C 105,86 98,86 95,91 Z" fill="none" stroke="#0d3863" stroke-width="2" />
    
    <!-- Piccola silhouette aereo alla fine della scia -->
    <g transform="translate(132, 88) rotate(35) scale(0.45)" fill="#0d3863">
      <path d="M0,10 L5,25 L15,25 L8,12 L18,5 L12,0 L0,5 L-12,0 L-18,5 L-8,12 L-15,25 L-5,25 Z"/>
    </g>

    <!-- Bandiera Tunisia -->
    <g transform="translate(5, 68) scale(0.65) rotate(-10)">
      <rect x="0" y="0" width="55" height="36" rx="6" class="tunisia-red" />
      <circle cx="27.5" cy="18" r="10" fill="#ffffff" />
      <path d="M 29,11 C 23,11 19,15 19,18 C 19,21 23,25 29,25 C 25,25 22,22 22,18 C 22,14 25,11 29,11 Z" fill="#e21a22" />
      <polygon points="28,15 29,17 32,17 30,19 31,22 29,20 27,22 28,19 25,17 27,17" fill="#e21a22" />
    </g>

    <!-- Bandiera UE -->
    <g transform="translate(115, 52) scale(0.65) rotate(10)">
      <rect x="0" y="0" width="55" height="36" rx="6" class="eu-blue" />
      <g transform="translate(27.5, 18) scale(0.5)">
        <!-- Cerchio di stelline semplificato per massima leggibilità su schermi piccoli -->
        <circle cx="0" cy="-12" r="2" class="eu-star"/>
        <circle cx="8.5" cy="-8.5" r="2" class="eu-star"/>
        <circle cx="12" cy="0" r="2" class="eu-star"/>
        <circle cx="8.5" cy="8.5" r="2" class="eu-star"/>
        <circle cx="0" cy="12" r="2" class="eu-star"/>
        <circle cx="-8.5" cy="8.5" r="2" class="eu-star"/>
        <circle cx="-12" cy="0" r="2" class="eu-star"/>
        <circle cx="-8.5" cy="-8.5" r="2" class="eu-star"/>
      </g>
    </g>
  </g>

  <!-- GRUPPO SCRITTA ARABA CENTRALE/DESTRA -->
  <g class="main-blue" transform="translate(160, -10) scale(1.15)">
    <!-- Scritta Calligrafica -->
    <path d="M 290,65 C 290,35 335,28 335,69 C 335,95 308,99 282,99 C 260,99 252,80 252,65 C 252,35 278,39 286,54 C 290,61 282,72 275,69 C 271,65 271,58 279,54" stroke="#0d3863" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="264" cy="24" r="5.5" />
    <circle cx="279" cy="24" r="5.5" />
    <path d="M 256,88 C 237,88 233,58 214,58 C 192,58 192,95 222,95 C 237,95 245,84 256,86" stroke="#0d3863" stroke-width="5.5" fill="none"/>
    <path d="M 225,77 C 225,62 202,62 202,77 C 202,92 225,92 225,77 Z" />
    <path d="M 199,90 C 176,90 165,58 146,62 C 131,64 124,81 139,92 C 150,99 169,96 184,96 C 188,96 189,51 190,25" stroke="#0d3863" stroke-width="9.5" fill="none" stroke-linecap="round"/>
    <path d="M 131,40 L 131,85 C 131,100 93,100 74,89 C 59,80 59,59 70,48" stroke="#0d3863" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 97,59 Q 108,63 104,70 T 116,70" stroke="#0d3863" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Linee dinamiche fluidificate sotto il testo -->
    <path d="M 75,108 C 120,98 200,96 260,102" class="line-green" />
    <path d="M 190,113 C 230,113 290,105 325,92" class="line-red" />
  </g>
</svg>
