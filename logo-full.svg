<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Hez Maak - EU Version</title>

  <defs>
    <clipPath id="innerCircleClip">
      <circle cx="200" cy="200" r="180"/>
    </clipPath>
    <style>
      .main-blue { fill: #16324f; }
      .stroke-blue { stroke: #16324f; stroke-width: 3.5; fill: none; }
      .dashed-path { stroke: #16324f; stroke-width: 2.5; stroke-dasharray: 5,5; fill: none; stroke-linecap: round; }
      .tunisia-red { fill: #e21a22; }
      .eu-blue { fill: #003399; }
      .eu-star { fill: #ffcc00; }
    </style>
  </defs>

  <!-- Anello esterno blu notte -->
  <circle cx="200" cy="200" r="196" fill="#16324f"/>

  <!-- Sfondo crema interno con clip path -->
  <circle cx="200" cy="200" r="186" fill="#fcfbf7" />

  <g clip-path="url(#innerCircleClip)">
    <!-- Aeroplano di carta in alto -->
    <g transform="translate(130, 45) scale(0.7)" stroke="#16324f" stroke-width="4.5" fill="none" stroke-linejoin="round">
      <polygon points="50,15 10,75 90,55" />
      <polygon points="50,15 50,85 90,55" />
      <path d="M 50,65 L 50,85" />
    </g>

    <!-- Scia tratteggiata superiore -->
    <path d="M 210,105 Q 260,85 300,100 T 350,140" class="dashed-path" />

    <!-- Testo Calligrafico Arabo Vettoriale Centrato -->
    <g class="main-blue" transform="translate(0, -5)">
      <path d="M 320,185 C 320,150 370,140 370,190 C 370,220 340,225 310,225 C 285,225 275,200 275,185 C 275,150 305,155 315,170 C 320,180 310,192 300,188 C 295,184 295,175 305,170" stroke="#16324f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="290" cy="135" r="6.5" />
      <circle cx="307" cy="135" r="6.5" />
      <path d="M 280,212 C 260,212 255,178 234,178 C 208,178 208,220 242,220 C 260,220 268,208 280,210" stroke="#16324f" stroke-width="5.5" fill="none"/>
      <path d="M 246,198 C 246,180 220,180 220,198 C 220,216 246,216 246,198 Z" />
      <path d="M 215,214 C 188,214 175,178 153,182 C 136,184 128,203 145,216 C 158,224 180,220 197,220 C 201,220 202,168 203,138" stroke="#16324f" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M 137,155 L 137,208 C 137,225 93,225 72,212 C 55,202 55,178 68,165" stroke="#16324f" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 98,177 Q 110,182 106,190 T 119,190" stroke="#16324f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Onde dinamiche inferiori (Verde e Rossa) -->
    <path d="M 85,250 C 120,235 200,232 270,240" stroke="#1d824c" stroke-width="8" fill="none" stroke-linecap="round" />
    <path d="M 210,258 C 250,258 315,248 355,232" stroke="#e21a22" stroke-width="6" fill="none" stroke-linecap="round" />

    <!-- Scia inferiore con aereo e cuore -->
    <path d="M 130,315 Q 160,325 180,310 Q 200,295 220,310 Q 250,325 280,310" class="dashed-path" />
    <path d="M 200,311 C 196,303 186,303 186,311 C 186,319 200,327 200,327 C 200,327 214,319 214,311 C 214,303 204,303 200,311 Z" fill="none" stroke="#16324f" stroke-width="2" />
    <g transform="translate(245, 305) rotate(40) scale(0.55)" fill="#16324f">
      <path d="M0,10 L5,25 L15,25 L8,12 L18,5 L12,0 L0,5 L-12,0 L-18,5 L-8,12 L-15,25 L-5,25 Z"/>
    </g>

    <!-- BANDIERA TUNISIA (Sinistra) -->
    <g transform="translate(70, 275) rotate(-12)">
      <rect x="0" y="0" width="60" height="40" rx="6" class="tunisia-red" />
      <circle cx="30" cy="20" r="11" fill="#ffffff" />
      <path d="M 32,12 C 26,12 21,16 21,20 C 21,24 26,28 32,28 C 28,28 24,25 24,20 C 24,15 28,12 32,12 Z" fill="#e21a22" />
      <polygon points="31,16 32,18 35,18 33,20 34,23 32,21 30,23 31,20 28,18 30,18" fill="#e21a22" />
    </g>

    <!-- NUOVA BANDIERA UNIONE EUROPEA (Destra) -->
    <g transform="translate(270, 285) rotate(12)">
      <rect x="0" y="0" width="60" height="40" rx="6" class="eu-blue" />
      <!-- Cerchio di 12 stelle UE geometriche -->
      <g transform="translate(30, 20) scale(0.65)">
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(0, -16) scale(0.3)"/>
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(8, -13.8) scale(0.3)"/>
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(13.8, -8) scale(0.3)"/>
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(16, 0) scale(0.3)"/>
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(13.8, 8) scale(0.3)"/>
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(8, 13.8) scale(0.3)"/>
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(0, 16) scale(0.3)"/>
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(-8, 13.8) scale(0.3)"/>
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(-13.8, 8) scale(0.3)"/>
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(-16, 0) scale(0.3)"/>
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(-13.8, -8) scale(0.3)"/>
        <polygon points="0,-15 3,-6 11,-6 5,-1 7,7 0,2 -7,7 -5,-1 -11,-6 -3,-6" class="eu-star" transform="translate(-8, -13.8) scale(0.3)"/>
      </g>
    </g>

    <!-- Calotta sferica inferiore blu notte -->
    <path d="M 56,338 A 180,180 0 0,0 344,338 A 180,180 0 0,1 56,338 Z" fill="#16324f" />

    <!-- Icona Valigia bianca al centro in basso -->
    <g transform="translate(180, 348) scale(0.75)" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="5" y="15" width="45" height="32" rx="5" />
      <path d="M 17,15 L 17,6 C 17,4 19,2 21,2 L 34,2 C 36,2 38,4 38,6 L 38,15" />
    </g>
  </g>
</svg>
