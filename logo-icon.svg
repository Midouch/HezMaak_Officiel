<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Hez Maak</title>

  <defs>
    <clipPath id="innerCircleClip">
      <circle cx="200" cy="200" r="180"/>
    </clipPath>
  </defs>

  <!-- Anello esterno blu notte -->
  <circle cx="200" cy="200" r="196" fill="#16324f"/>

  <!-- Sfondo crema -->
  <circle cx="200" cy="200" r="180" fill="#faf3e7"/>

  <g clip-path="url(#innerCircleClip)">

    <!-- Rotta tratteggiata -->
    <path d="M 95 128 Q 165 78 232 96" fill="none" stroke="#16324f" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>

    <!-- Aereo di carta -->
    <g transform="translate(232,96) rotate(18)">
      <path d="M0,0 L34,-13 L2,9 L7,25 Z" fill="none" stroke="#16324f" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- Calligrafia araba "هزّ معاك" -->
    <text x="200" y="205" text-anchor="middle" font-family="'Noto Naskh Arabic','Amiri','Traditional Arabic',serif" font-size="70" font-weight="700" fill="#16324f">هزّ معاك</text>

    <!-- Riga verde decorativa -->
    <rect x="142" y="222" width="116" height="7" rx="3.5" fill="#009246"/>

    <!-- Bandiera Tunisia -->
    <g transform="translate(112,262)">
      <circle r="19" fill="#e70013"/>
      <circle r="10.5" fill="#faf3e7"/>
      <circle r="7" fill="#e70013"/>
      <circle cx="2.4" cy="0" r="5.6" fill="#faf3e7"/>
      <path d="M 6,-4.2 L 8,0 L 6,4.2 L 8.6,2 L 9.6,4.8 L 9.9,1.9 L 12.6,2.6 L 10.4,0.7 L 12.6,-1.2 L 9.9,-0.5 L 9.6,-3.4 L 8.6,-0.6 Z" fill="#e70013"/>
    </g>

    <!-- Cuoricino -->
    <path d="M 168,260 C 164,253 154,255 154,263 C 154,270 163,277 168,281 C 173,277 182,270 182,263 C 182,255 172,253 168,260 Z" fill="#16324f"/>

    <!-- Aeroplanino centrale -->
    <g transform="translate(196,256) rotate(12) scale(0.65)">
      <path d="M0,0 L34,-13 L2,9 L7,25 Z" fill="#16324f"/>
    </g>

    <!-- Bandiera Unione Europea -->
    <g transform="translate(288,262)">
      <circle r="19" fill="#003399"/>
      <g fill="#ffcc00">
        <circle cx="0" cy="-13.5" r="1.6"/>
        <circle cx="6.75" cy="-11.7" r="1.6"/>
        <circle cx="11.7" cy="-6.75" r="1.6"/>
        <circle cx="13.5" cy="0" r="1.6"/>
        <circle cx="11.7" cy="6.75" r="1.6"/>
        <circle cx="6.75" cy="11.7" r="1.6"/>
        <circle cx="0" cy="13.5" r="1.6"/>
        <circle cx="-6.75" cy="11.7" r="1.6"/>
        <circle cx="-11.7" cy="6.75" r="1.6"/>
        <circle cx="-13.5" cy="0" r="1.6"/>
        <circle cx="-11.7" cy="-6.75" r="1.6"/>
        <circle cx="-6.75" cy="-11.7" r="1.6"/>
      </g>
    </g>

    <!-- Collinetta blu notte -->
    <path d="M -20,332 Q 200,392 420,332 L 420,420 L -20,420 Z" fill="#16324f"/>

    <!-- Valigia -->
    <g transform="translate(200,368)">
      <rect x="-9" y="-24" width="18" height="9" rx="2.5" fill="none" stroke="#faf3e7" stroke-width="3.4"/>
      <rect x="-24" y="-15" width="48" height="34" rx="6" fill="#faf3e7"/>
      <line x1="0" y1="-15" x2="0" y2="19" stroke="#16324f" stroke-width="2.6"/>
      <rect x="-16" y="-2" width="6" height="6" rx="1.4" fill="#16324f"/>
      <rect x="10" y="-2" width="6" height="6" rx="1.4" fill="#16324f"/>
    </g>

  </g>

</svg>
